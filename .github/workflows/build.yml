name: Build Wii U app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Wii U libraries
        run: |
          dkp-pacman -Sy --noconfirm
          dkp-pacman -S --needed --noconfirm wiiu-dev wiiu-curl
      - name: Build
        run: make
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: wiiu_nettest
          path: |
            *.wuhb
            *.rpx
