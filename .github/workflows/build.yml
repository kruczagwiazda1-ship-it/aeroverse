name: Build Wii U app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Wii U libraries
        run: |
          for i in 1 2 3 4 5 6; do
            echo "Attempt $i"
            if dkp-pacman -Sy --noconfirm && dkp-pacman -S --needed --noconfirm wiiu-dev wiiu-curl; then
              exit 0
            fi
            sleep 30
          done
          exit 1
      - name: Get CA certificates
        run: |
          mkdir -p data
          curl -fsSL https://curl.se/ca/cacert.pem -o data/cacert.pem || wget -O data/cacert.pem https://curl.se/ca/cacert.pem
          ls -la data
      - name: Build
        run: make
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: wiiu_nettest
          path: |
            *.wuhb
            *.rpx
